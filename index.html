<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كودنيمز - النسخة السعودية الفاخرة</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #15151b;
            --card-bg: #1e1e26;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --red-team: #c0392b;
            --blue-team: #2980b9;
            --neutral: #4a5568;
            --assassin: #111115;
            --text-main: #ffffff;
            --border-color: #333340;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            width: 100%;
            max-width: 850px;
        }

        h1 {
            color: var(--gold);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            color: var(--gold-light);
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 850px;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            font-size: 1.05rem;
            font-weight: bold;
        }

        .turn-red { color: #ff6b6b; text-shadow: 0 0 8px rgba(255,107,107,0.4); }
        .turn-blue { color: #4dabf7; text-shadow: 0 0 8px rgba(77,171,247,0.4); }

        .control-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--gold);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--gold);
            color: var(--bg-color);
            transform: translateY(-2px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 850px;
            width: 100%;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            aspect-ratio: 4/3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            text-align: center;
            padding: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .card:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* الكروت بعد الكشف */
        .card.revealed-red {
            background-color: var(--red-team);
            border-color: #e74c3c;
            color: white;
            cursor: default;
        }

        .card.revealed-blue {
            background-color: var(--blue-team);
            border-color: #3498db;
            color: white;
            cursor: default;
        }

        .card.revealed-neutral {
            background-color: var(--neutral);
            border-color: #718096;
            color: #e2e8f0;
            cursor: default;
        }

        .card.revealed-assassin {
            background-color: var(--assassin);
            border-color: #e74c3c;
            color: #ff6b6b;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
            cursor: default;
        }

        /* وضع القائد (Spymaster Mode) */
        .spymaster-mode .card:not(.revealed-red):not(.revealed-blue):not(.revealed-neutral):not(.revealed-assassin).role-red {
            border: 3px dashed #ff6b6b;
            box-shadow: inset 0 0 10px rgba(255,107,107,0.2);
        }
        .spymaster-mode .card:not(.revealed-red):not(.revealed-blue):not(.revealed-neutral):not(.revealed-assassin).role-blue {
            border: 3px dashed #4dabf7;
            box-shadow: inset 0 0 10px rgba(77,171,247,0.2);
        }
        .spymaster-mode .card:not(.revealed-red):not(.revealed-blue):not(.revealed-neutral):not(.revealed-assassin).role-neutral {
            border: 3px dashed #718096;
        }
        .spymaster-mode .card:not(.revealed-red):not(.revealed-blue):not(.revealed-neutral):not(.revealed-assassin).role-assassin {
            border: 3px dashed #e74c3c;
            background-color: #2a0808;
            box-shadow: inset 0 0 15px #e74c3c;
        }

        .status-msg {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.05rem;
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>كودنيمز — النسخة السعودية 🇸🇦</h1>
        <div class="subtitle">كلمات أصيلة، ذكاء، وتحدي جماعي</div>
    </header>

    <div class="game-info">
        <div>دور الفريق: <span id="current-team" class="turn-red">الصقور (الأحمر)</span></div>
        <div>المتبقي: <span style="color:#ff6b6b">🔴 <span id="red-left">9</span></span> | <span style="color:#4dabf7">🔵 <span id="blue-left">8</span></span></div>
    </div>

    <div class="control-panel">
        <button onclick="toggleSpymaster()">👁️ وضع القائد (Spymaster)</button>
        <button onclick="endTurn()">إنهاء الدور</button>
        <button onclick="initGame()" style="border-color: #ff6b6b;">🔄 لعبة جديدة</button>
    </div>

    <div class="board" id="board"></div>

    <div class="status-msg" id="status-msg">
        قائد فريق الصقور يعطي التلميح الآن.. اختر الكلمات بعناية!
    </div>

    <script>
        // بنك كلمات سعودي غني ومتنوع بالكامل (أماكن، أكلات، مصطلحات وتراث)
        const dictionary = [
            "كبسة", "ددسن", "الثمامة", "قهوة", "شاص", 
            "طويق", "البجيري", "جريش", "بوليفارد", "فنجان", 
            "ساهر", "كشتة", "فزعة", "قرص", "مفطح",
            "العلا", "بريدة", "مرور", "كبوت", "سمبوسة", 
            "لقيمات", "دلة", "هلي", "سفاري", "الملز", 
            "سليق", "مرقوق", "مراصيع", "مصبوبة", "حنيذ",
            "مندي", "مقصاص", "جيب", "ربع", "شماغ", 
            "عقال", "بشت", "مركاز", "دريشة", "حوش",
            "صaخري", "مطلاع", "نفود", "دهناء", "ربيع",
            "قمري", "وبر", "ضب", "حبحب", "تمر"
        ];

        let boardData = [];
        let currentTeam = 'red'; // الفريق الأحمر يبدأ بـ 9 كروت
        let isSpymaster = false;
        let gameOver = false;
        let redRemaining = 9;
        let blueRemaining = 8;

        function initGame() {
            gameOver = false;
            isSpymaster = false;
            currentTeam = 'red';
            redRemaining = 9;
            blueRemaining = 8;

            // خلط واختيار 25 كلمة للوحة الأصلية (5x5)
            let shuffledWords = [...dictionary].sort(() => 0.5 - Math.random()).slice(0, 25);

            // توزيع الأدوار الأصلي: 9 للفريق الأول، 8 للفريق الثاني، 7 محايد، 1 اغتيال (قنبلة)
            let roles = [
                ...Array(9).fill('red'),
                ...Array(8).fill('blue'),
                ...Array(7).fill('neutral'),
                'assassin'
            ];
            roles.sort(() => 0.5 - Math.random());

            boardData = shuffledWords.map((word, index) => ({
                word: word,
                role: roles[index],
                revealed: false
            }));

            updateUI();
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = "";
            
            if (isSpymaster) {
                board.classList.add('spymaster-mode');
            } else {
                board.classList.remove('spymaster-mode');
            }

            boardData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card role-${item.role}`;
                card.innerText = item.word;

                if (item.revealed) {
                    if (item.role === 'red') card.classList.add('revealed-red');
                    else if (item.role === 'blue') card.classList.add('revealed-blue');
                    else if (item.role === 'neutral') card.classList.add('revealed-neutral');
                    else if (item.role === 'assassin') card.classList.add('revealed-assassin');
                }

                card.onclick = () => revealCard(index);
                board.appendChild(card);
            });
        }

        function revealCard(index) {
            if (gameOver || boardData[index].revealed) return;

            boardData[index].revealed = true;
            let role = boardData[index].role;
            let msg = document.getElementById('status-msg');

            // إذا اختار كرت الاغتيال (القنبلة) يخسر فوري وتفوز الفريق الخصم
            if (role === 'assassin') {
                gameOver = true;
                msg.innerHTML = `💥 يا لطيف! طحتم في كرت الاغتيال (<span style="color:#ff6b6b">${boardData[index].word}</span>)! فاز الفريق الخصم فوراً!`;
                isSpymaster = true; // كشف اللوحة بالكامل عند الخسارة
                renderBoard();
                return;
            }

            if (role === 'red') {
                redRemaining--;
                if (redRemaining === 0) {
                    gameOver = true;
                    msg.innerHTML = "🎉 مبروك! فريق الصقور (الأحمر) كشف كل كلماته وفاز باللعبة!";
                    renderBoard();
                    return;
                }
            } else if (role === 'blue') {
                blueRemaining--;
                if (blueRemaining === 0) {
                    gameOver = true;
                    msg.innerHTML = "🎉 مبروك! فريق النمور (الأزرق) كشف كل كلماته وفاز باللعبة!";
                    renderBoard();
                    return;
                }
            }

            // نظام انتقال الدور الأصلي: إذا اختار كرت الفريق الخطأ أو كرت محايد، ينتقل الدور للخصم
            if (role !== currentTeam) {
                currentTeam = (currentTeam === 'red') ? 'blue' : 'red';
                let teamName = currentTeam === 'red' ? 'الصقور (الأحمر)' : 'النمور (الأزرق)';
                msg.innerText = `إجابة خاطئة! انتهى دورك وانتقل الدور إلى فريق ${teamName}.`;
            } else {
                msg.innerText = `إصابة موفقة! كرت تابع لفريقك، استمر في التخمير أو أنهِ دورك.`;
            }

            updateUI();
        }

        function endTurn() {
            if (gameOver) return;
            currentTeam = (currentTeam === 'red') ? 'blue' : 'red';
            let teamName = currentTeam === 'red' ? 'الصقور (الأحمر)' : 'النمور (الأزرق)';
            document.getElementById('status-msg').innerText = `انتقل الدور رسمياً إلى فريق ${teamName}. بانتظار تلميح القائد..`;
            updateUI();
        }

        function toggleSpymaster() {
            isSpymaster = !isSpymaster;
            renderBoard();
        }

        function updateUI() {
            renderBoard();
            document.getElementById('red-left').innerText = redRemaining;
            document.getElementById('blue-left').innerText = blueRemaining;
            
            let teamSpan = document.getElementById('current-team');
            if (currentTeam === 'red') {
                teamSpan.className = "turn-red";
                teamSpan.innerText = "الصقور (الأحمر)";
            } else {
                teamSpan.className = "turn-blue";
                teamSpan.innerText = "النمور (الأزرق)";
            }
        }

        // تشغيل اللعبة عند التحميل
        initGame();
    </script>
</body>
</html>
