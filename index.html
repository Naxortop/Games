<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سري للغاية - النسخة السعودية</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #1f1f1f;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --white: #ffffff;
            --red-team: #c0392b;
            --blue-team: #2980b9;
            --neutral: #7f8c8d;
            --bomb: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--white);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--gold);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        /* ألوان الكروت بعد الكشف */
        .card.team-red {
            background-color: var(--red-team);
            border-color: #e74c3c;
            color: white;
        }

        .card.team-blue {
            background-color: var(--blue-team);
            border-color: #3498db;
            color: white;
        }

        .card.neutral {
            background-color: var(--neutral);
            border-color: #95a5a6;
            color: #ddd;
        }

        .card.bomb {
            background-color: var(--bomb);
            border-color: #e74c3c;
            color: #e74c3c;
            text-shadow: 0 0 8px #e74c3c;
        }

        .status-panel {
            background: var(--card-bg);
            border: 1px solid var(--gold);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .reset-btn {
            background-color: var(--gold);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background-color: var(--gold-light);
        }
    </style>
</head>
<body>

    <h1>سري للغاية (نسخة كودنيمز السعودية) 🇸🇦</h1>
    <div class="subtitle">اختر الكلمات بناءً على تلميح قائد الفريق!</div>

    <div class="game-board" id="board">
        <!-- سيتم توليد الكروت هنا برمجياً -->
    </div>

    <div class="status-panel" id="status-msg">
        دور فريق الصقور 🦅 (ابحث عن الكلمات المرتبطة)
    </div>

    <button class="reset-btn" onclick="initGame()">إعادة اللعبة</button>

    <script>
        // بنك الكلمات السعودي
        const saudiWords = [
            "كبسة", "ددسن", "الثمامة", "قهوة", "شاص", 
            "طويق", "البجيري", "جريش", "بوليفارد", "فنجان", 
            "ساهر", "كشتة", "فزعة", "سحبة"
        ];

        let boardData = [];

        function initGame() {
            // خلط الكلمات واختيار 12 كلمة للوحة
            let shuffled = [...saudiWords].sort(() => 0.5 - Math.random());
            let selectedWords = shuffled.slice(0, 12);

            // توزيع عشوائي للأدوار (فريق أحمر، فريق أزرق، محايد، قنبلة واحدة)
            let roles = ['red', 'red', 'red', 'blue', 'blue', 'blue', 'neutral', 'neutral', 'neutral', 'neutral', 'neutral', 'bomb'];
            roles.sort(() => 0.5 - Math.random());

            boardData = selectedWords.map((word, index) => ({
                word: word,
                role: roles[index],
                revealed: false
            }));

            renderBoard();
            document.getElementById('status-msg').innerText = "اللعبة بدأت! اختر كلمة بناءً على التلميح.";
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = "";

            boardData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = item.word;

                if (item.revealed) {
                    if (item.role === 'red') card.classList.add('team-red');
                    else if (item.role === 'blue') card.classList.add('team-blue');
                    else if (item.role === 'neutral') card.classList.add('neutral');
                    else if (item.role === 'bomb') card.classList.add('bomb', 'revealed-bomb');
                    card.innerText += item.role === 'bomb' ? ' 💣' : '';
                }

                card.onclick = () => revealCard(index);
                board.appendChild(card);
            });
        }

        function revealCard(index) {
            if (boardData[index].revealed) return;

            boardData[index].revealed = true;
            renderBoard();

            const msg = document.getElementById('status-msg');
            if (boardData[index].role === 'bomb') {
                msg.innerText = "💥 يا لطيف! طحتم في القنبلة (ساهر)! انتهت اللعبة!";
                revealAll();
            } else if (boardData[index].role === 'neutral') {
                msg.innerText = "هذي كلمة عادية (محايدة)، راح الدور على الفريق الثاني.";
            } else {
                msg.innerText = "إصابة موفقة! كرت تابع لفريقك، كمل لعب.";
            }
        }

    function revealAll() {
        boardData.forEach(item => item.revealed = true);
        renderBoard();
    }

    // تشغيل اللعبة لأول مرة
    initGame();
</script>

</body>
</html>
